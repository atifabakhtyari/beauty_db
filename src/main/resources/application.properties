spring.datasource.url=jdbc:postgresql://localhost:5432/booking_db

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# جلوگیری از باقی ماندن Session در لایه وب (کاهش ریسک N+1 و نشتی داده)
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000


resend.api-key=${RESEND_API_KEY}


#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=${MAIL_USERNAME}
#spring.mail.password=${MAIL_PASSWORD}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true



spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# Profile image storage
app.upload.profile-dir=uploads/profiles

# Maximum upload size: 5MB for the file, slightly more for the request envelope
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Provider images
app.upload.provider-dir=uploads/providers

# Password reset hardening
app.password-reset.code-expiry-minutes=10
app.password-reset.max-code-attempts=5
app.password-reset.resend-cooldown-seconds=60
app.password-reset.max-requests-per-window=5
app.password-reset.request-window-minutes=15
app.password-reset.max-verify-failures-per-window=10
app.password-reset.verify-window-minutes=15

# Do not leak internal details in default error pages
server.error.include-stacktrace=never
server.error.include-message=never
